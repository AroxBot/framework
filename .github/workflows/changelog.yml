name: Generate Changelog

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

jobs:
  changelog:
    name: Generate changelog
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main

      - name: Generate changelog
        uses: orhun/git-cliff-action@v4
        with:
          config: cliff.toml
          args: --verbose
          output_file: CHANGELOG.md
        env:
          GITHUB_REPO: ${{ github.repository }}

      - name: Checkout or create changelog branch
        run: |
          git fetch origin
          git checkout -B changelog origin/changelog || git checkout -B changelog
          git checkout main -- CHANGELOG.md

      - name: Commit changelog
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add CHANGELOG.md
          git diff --cached --quiet && exit 0
          git commit -m "Update changelog from main"
          git push origin changelog --force
